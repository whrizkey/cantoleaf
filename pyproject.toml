[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cantoleaf"
version = "0.1.0"
description = "Open-source BYOK & local-first cognitive audio reader and audiobook studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "whrizkey" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "ebooklib>=0.18",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "trafilatura>=1.8.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
tts = [
    "edge-tts>=6.1.12",
    "kokoro-onnx>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
cantoleaf = "cantoleaf.cli:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "ebooklib.*",
    "fitz.*",
    "docx.*",
    "trafilatura.*",
    "soundfile.*",
    "edge_tts.*",
    "kokoro_onnx.*",
    "keyring.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
